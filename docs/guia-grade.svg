<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="640" height="640" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="px" width="1" height="1" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="none" stroke="#000" stroke-opacity=".08" stroke-width=".05"/>
    </pattern>
    <pattern id="px8" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none" stroke="#000" stroke-opacity=".25" stroke-width=".08"/>
    </pattern>
  </defs>
  <rect width="64" height="64" fill="#fff"/>
  <!-- área do chapéu: tudo acima da linha y=16 (pode descer até y=20 cobrindo a testa) -->
  <rect x="0" y="0" width="64" height="16" fill="#f5a623" fill-opacity=".18"/>
  <rect x="0" y="16" width="64" height="5" fill="#f5a623" fill-opacity=".08"/>
  <rect x="0" y="16" width="64" height=".25" fill="#f5a623"/>
  <!-- olhos -->
  <rect x="18" y="26" width="12" height="8" fill="#4a90e2" fill-opacity=".35"/>
  <rect x="34" y="26" width="12" height="8" fill="#4a90e2" fill-opacity=".35"/>
  <rect x="18" y="26" width="28" height="8" fill="none" stroke="#4a90e2" stroke-width=".2"/>
  <!-- boca -->
  <rect x="24" y="40" width="16" height="6" fill="#d0021b" fill-opacity=".3"/>
  <!-- eixo central (entre as colunas 31 e 32) -->
  <rect x="31.9" y="0" width=".2" height="64" fill="#9013fe" fill-opacity=".5"/>
  <rect width="64" height="64" fill="url(#px)"/>
  <rect width="64" height="64" fill="url(#px8)"/>
</svg>
